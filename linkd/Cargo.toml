[package]
name = "linkd"
version = "5.1.2"
edition = "2021"
description = "Linux Link daemon — Linux <-> Android continuity"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", features = ["pem"] }
rustls-pemfile = "2"
bluer = { version = "0.17", features = ["bluetoothd"] }
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
# System tray icon (StatusNotifierItem / AppIndicator) — PC app.
ksni = "0.3"
# Pairing window (QR code display).
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.14.0", features = ["xfixes"] }
evdev = "0.13.2"

[profile.release]
lto = true
strip = true
